<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PocketSmart AI</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><h1>PocketSmart AI</h1><p>Plan smart. Spend wisely.</p></header><main><nav class="tabs"><button class="tab active" type="button" data-kind="party">🎉 Party Planner</button><button class="tab" type="button" data-kind="interior">🏠 Interior Planner</button></nav><section class="panel"><form id="plannerForm"><input type="hidden" id="kind" value="party"><div class="field"><label for="budget">Total Budget (₹)</label><input id="budget" type="number" min="1" placeholder="e.g. 80000" required></div><div id="partyFields"><div class="field"><label for="guests">Number of Guests</label><input id="guests" type="number" min="1" value="50" required></div><div class="field"><label for="event">Event Type</label><select id="event"><option>Birthday</option><option>Engagement</option><option>Wedding</option><option>Get-together</option></select></div><div class="field"><label for="venue">Venue</label><input id="venue" value="Party hall"></div></div><div id="interiorFields" hidden><div class="field"><label for="rooms">Rooms / Areas</label><input id="rooms" value="Hall, Kitchen, Bedroom"></div><div class="field"><label for="items">Required Items</label><textarea id="items" rows="2">3 Ceiling fan, 1 TV table, 1 sofa</textarea></div></div><button class="generate" id="generateBtn" type="submit">Generate Recommendation</button></form></section><section class="result" aria-live="polite"><h2>🤖 AI Recommendation</h2><div id="output">Your budget plan will appear here.</div></section></main><footer>© 2026 PocketSmart AI</footer><script src="{{ url_for('static',filename='script.js') }}"></script></body></html>
